# Local hooks are a subset of CI, not a replacement. They run the offline
# checks of the CI lint job plus the installer and pin-report tests. Not run here:
# the other test-*.sh suites, shellcheck, markdownlint-cli2, lychee, actionlint,
# zizmor, the secret scan and semgrep. The full list is in AGENTS.md.
repos:
  - repo: local
    hooks:
      - id: protected-cluster-health-overlay
        name: protected cluster-health overlay stays private
        entry: ./scripts/check-protected-overlay.sh
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: private-cluster-health-leak-check
        name: private cluster-health pattern leak check
        entry: ./scripts/check-private-skill-leaks.sh
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: freshness-date-check
        name: freshness markers use current collection month (advisory)
        # Only exit 1 (stale markers) is downgraded; any other failure blocks.
        entry: bash -c 'rc=0; ./scripts/check-freshness-dates.sh || rc=$?; if (( rc == 1 )); then echo "advisory - freshness markers are stale, not blocking"; else exit "$rc"; fi'
        verbose: true
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: deep-audit-coverage-check
        name: deep-audit accounts for public skills
        entry: ./scripts/check-deep-audit-coverage.sh
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: contract-sync-check
        name: skills carry in-sync output-contract, no runtime _shared refs
        entry: ./scripts/check-contract-sync.sh
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: skill-collection-lint
        name: lint skill collection
        entry: ./scripts/lint-skills.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: agent-skills-spec-validation
        name: validate Agent Skills spec
        entry: ./scripts/validate-spec.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: version-receipt-structure
        name: version receipts are well formed (receipt age is advisory, CI only)
        entry: env SKILLS_PIN_MAX_AGE_DAYS=36500 ./scripts/check-version-receipts.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: first-paragraph-check
        name: first-paragraph storefront copy
        entry: ./scripts/check-first-paragraph.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: migration-notice-check
        name: migration notices and grace period
        entry: ./scripts/check-migrations.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: refiner-state-check
        name: refiner run-history state
        entry: ./scripts/check-refiner-state.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: stack-conventions-check
        name: stack conventions
        entry: python3 .github/stack/stack-check.py
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: whitespace-check
        name: whitespace and merge markers
        entry: ./scripts/check-whitespace.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: refiner-phase1-guard
        name: refiner phase-1 immutability guard
        entry: ./scripts/check-refiner-phase1-guard.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: docs-impact-check
        name: docs follow installer, tooling, and skill removals
        entry: ./scripts/check-docs-impact.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: installer-regression-tests
        name: test installer behavior
        entry: bash -c './scripts/test-install.sh && ./scripts/test-setup.sh && ./scripts/test-update.sh'
        language: system
        pass_filenames: false
        files: ^(install\.sh|scripts/(test-install\.sh|test-setup\.sh|test-update\.sh|skill-frontmatter\.py|skill-lib\.sh|migrate-skills\.py)|migrations\.json|\.pre-commit-config\.yaml)$
        stages: [pre-push]

      - id: tool-pin-report-tests
        name: test the pin report and the Renovate zizmor pattern
        entry: ./scripts/test-report-tool-pins.sh
        language: system
        pass_filenames: false
        files: ^(renovate\.json|scripts/(test-)?report-tool-pins\.sh|\.github/workflows/(ci|security)\.yml)$
        stages: [pre-push]
