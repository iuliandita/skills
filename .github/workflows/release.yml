name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gates:
    name: gates
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  publish:
    name: publish
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the tag points at main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

      - name: Check cumulative release documentation impact
        run: |
          previous=""
          if git rev-parse --verify --quiet "${GITHUB_SHA}^" >/dev/null; then
            # Strict version tags only; unrelated histories and this commit's tags are excluded.
            tags="$(git tag --merged "${GITHUB_SHA}^" --sort=-version:refname)"
            mapfile -t candidates < <(
              printf '%s\n' "$tags" | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/'
            )
            previous="${candidates[0]:-}"
          fi
          if [ -z "$previous" ]; then
            mapfile -t roots < <(git rev-list --max-parents=0 "$GITHUB_SHA")
            if [ "${#roots[@]}" -ne 1 ]; then
              echo "::error::First release requires one history root for the initial-state baseline"
              exit 1
            fi
            previous="${roots[0]}"
            echo "No previous version tag; checking all changes since initial-state commit $previous"
          else
            echo "Checking cumulative documentation impact since $previous"
          fi
          ./scripts/check-docs-impact.sh --release "$previous"

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ./scripts/changelog-notes.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
