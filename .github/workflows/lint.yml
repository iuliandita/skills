name: Quality Gates

on:
  push:
    branches: [develop, main]
    paths:
      - "skills/**"
      - "scripts/**"
      - "install.sh"
      - "CHANGELOG.md"
      - "INSTALL.md"
      - "MIGRATION.md"
      - "migrations.json"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "docs/**"
      - ".pre-commit-config.yaml"
      - ".markdownlint-cli2.jsonc"
      - "lychee.toml"
      - ".github/workflows/**"
      - ".github/tools/**"
      - ".github/zizmor.yml"
      - ".refiner-runs.json"
      - ".refiner-ledger.md"
      - ".gitignore"
      - ".gitleaks.toml"
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "install.sh"
      - "CHANGELOG.md"
      - "INSTALL.md"
      - "MIGRATION.md"
      - "migrations.json"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "docs/**"
      - ".pre-commit-config.yaml"
      - ".markdownlint-cli2.jsonc"
      - "lychee.toml"
      - ".github/workflows/**"
      - ".github/tools/**"
      - ".github/zizmor.yml"
      - ".refiner-runs.json"
      - ".refiner-ledger.md"
      - ".gitignore"
      - ".gitleaks.toml"
  schedule:
    # Weekly run catches link rot and new semgrep findings between changes.
    - cron: "0 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check protected overlay guardrail
        run: ./scripts/check-protected-overlay.sh

      - name: Check private cluster-health leak patterns
        run: ./scripts/check-private-skill-leaks.sh

      # Date-dependent freshness is advisory: a calendar rollover warns, it does not fail.
      - name: Check freshness date markers (advisory)
        run: |
          if ! ./scripts/check-freshness-dates.sh; then
            echo "::warning title=Freshness markers (advisory)::Currentness labels are behind the collection month; refresh them in the next sweep."
          fi

      - name: Check version receipt structure
        env:
          SKILLS_PIN_MAX_AGE_DAYS: "36500"
        run: ./scripts/check-version-receipts.sh

      - name: Check version receipt age (advisory)
        run: |
          if ! ./scripts/check-version-receipts.sh; then
            echo "::warning title=Version receipts (advisory)::A version receipt is older than the 120-day budget; re-verify its pins."
          fi

      - name: Check first-paragraph storefront copy
        run: ./scripts/check-first-paragraph.sh

      - name: Check deep-audit skill coverage
        run: ./scripts/check-deep-audit-coverage.sh

      - name: Check migration notices and grace period
        run: ./scripts/check-migrations.sh

      - name: Check output-contract sync
        run: ./scripts/check-contract-sync.sh

      - name: Check refiner run-history state
        run: ./scripts/check-refiner-state.sh

      - name: Lint skill collection
        run: ./scripts/lint-skills.sh

      - name: Validate Agent Skills spec compliance
        run: ./scripts/validate-spec.sh

      - name: Check whitespace and merge markers
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: ./scripts/check-whitespace.sh

      - name: Check refiner phase-1 immutability guard
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: ./scripts/check-refiner-phase1-guard.sh

      - name: Check docs impact
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: ./scripts/check-docs-impact.sh

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: |
          for f in install.sh scripts/*.sh skills/repo-audit/references/detect.sh; do
            bash -n "$f"
          done

      - name: Test installer behavior
        run: ./scripts/test-install.sh

      - name: Test installer detect and saved config
        run: ./scripts/test-setup.sh

      - name: Test installer scheduled updates
        run: ./scripts/test-update.sh

      - name: Test migration behavior
        run: |
          ./scripts/test-migrate-skills.sh
          python3 scripts/test-migrations.py

      - name: Test lint behavior
        run: ./scripts/test-lint-skills.sh

      - name: Test skill content invariants
        run: ./scripts/test-skill-content.sh

      - name: Test Agent Skills validator behavior
        run: ./scripts/test-validate-spec.sh

      - name: Test version receipt behavior
        run: ./scripts/test-version-receipts.sh

      - name: Test private leak marker behavior
        run: ./scripts/test-private-skill-leaks.sh

      - name: Test CI base ref checks
        run: ./scripts/test-ci-base-checks.sh

      - name: Test docs-impact check
        run: ./scripts/test-docs-impact.sh

      - name: Test changelog notes extraction
        run: ./scripts/test-changelog-notes.sh

      - name: Shellcheck scripts
        run: shellcheck install.sh scripts/*.sh skills/repo-audit/references/detect.sh

      - name: Check Python helper syntax
        run: python3 -m py_compile scripts/*.py

  markdown:
    name: markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install markdownlint-cli2
        run: |
          mkdir -p "$RUNNER_TEMP/markdownlint-cli2"
          cp .github/tools/markdownlint/package.json .github/tools/markdownlint/package-lock.json "$RUNNER_TEMP/markdownlint-cli2/"
          npm ci --prefix "$RUNNER_TEMP/markdownlint-cli2" --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/markdownlint-cli2/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Lint Markdown
        run: markdownlint-cli2

  links:
    name: links
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lychee
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo /tmp/lychee.tar.gz "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  /tmp/lychee.tar.gz" | sha256sum --check
          tar -xzf /tmp/lychee.tar.gz -C "$HOME/.local/bin" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check links
        run: |
          mapfile -t markdown_files < <(
            {
              printf '%s\n' README.md SECURITY.md CONTRIBUTING.md
              printf '%s\n' CHANGELOG.md INSTALL.md MIGRATION.md
              find skills docs -type f -name '*.md' 2>/dev/null
            } | sort -u
          )
          lychee --config lychee.toml "${markdown_files[@]}"

  workflow:
    name: workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.30.1"
          advanced-security: false
          annotations: true

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet --require-hashes -r .github/tools/semgrep/requirements.txt
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"

      - name: Secret scan
        run: gitleaks git --redact .

      - name: Static analysis
        # Limit semgrep to executable/config files. The Markdown corpus contains
        # intentional security examples that would create noisy false positives.
        run: >
          semgrep scan --metrics off --error
          --config p/ci --config p/github-actions
          install.sh scripts .github/workflows skills/repo-audit/references/detect.sh
