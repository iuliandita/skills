name: Tool Pins

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report checksum-pinned binaries behind upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/report-tool-pins.sh --issue
